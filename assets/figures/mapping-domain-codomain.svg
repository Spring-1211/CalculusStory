<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">映射的定义域、陪域和值域</title>
  <desc id="desc">左侧定义域 A 的三个元素通过箭头映到右侧陪域 B 的三个元素，其中 B 中有一个元素没有原像，说明值域可以真包含于陪域。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f5d62"/>
    </marker>
  </defs>
  <rect width="760" height="300" fill="#fbfaf7"/>
  <text x="170" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#1f2933">定义域 A</text>
  <text x="590" y="38" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#1f2933">陪域 B</text>
  <ellipse cx="170" cy="160" rx="105" ry="105" fill="#e5f0ef" stroke="#2f5d62" stroke-width="2"/>
  <ellipse cx="590" cy="160" rx="105" ry="105" fill="#f3e8d5" stroke="#9a6a2f" stroke-width="2"/>
  <g font-family="sans-serif" font-size="18" fill="#1f2933">
    <circle cx="170" cy="105" r="18" fill="#fff" stroke="#2f5d62"/><text x="170" y="111" text-anchor="middle">a</text>
    <circle cx="170" cy="160" r="18" fill="#fff" stroke="#2f5d62"/><text x="170" y="166" text-anchor="middle">b</text>
    <circle cx="170" cy="215" r="18" fill="#fff" stroke="#2f5d62"/><text x="170" y="221" text-anchor="middle">c</text>
    <circle cx="590" cy="105" r="18" fill="#fff" stroke="#9a6a2f"/><text x="590" y="111" text-anchor="middle">1</text>
    <circle cx="590" cy="160" r="18" fill="#fff" stroke="#9a6a2f"/><text x="590" y="166" text-anchor="middle">2</text>
    <circle cx="590" cy="215" r="18" fill="#fff" stroke="#9a6a2f"/><text x="590" y="221" text-anchor="middle">3</text>
  </g>
  <g stroke="#2f5d62" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M190 105 C300 90 445 92 566 105"/>
    <path d="M190 160 C305 160 445 160 566 160"/>
    <path d="M190 215 C300 230 445 228 566 215"/>
  </g>
  <text x="380" y="278" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#5b6770">值域 = {1, 2, 3}；若没有指向 3，值域只会是陪域的子集</text>
</svg>
