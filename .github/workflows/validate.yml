name: Validate CalculusStory

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-data.mjs
      - run: node --check portal.js
      - run: node --check assistant.js
      - run: node --check timeline.js
      - run: node --check graph.js
